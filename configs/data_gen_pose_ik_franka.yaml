# configs/data_gen_pose_ik_franka.yaml

logging:
  log_dir: "logs/pose_ik"

run:
  seed: 42
  deterministic: true

data:
  urdf_root: "/home/user/mcfp/data/urdf/franka_emika_panda/urdf"
  # urdf_root: "D:/code/mcfp/data/urdf/franka_emika_panda/urdf"
  output_root: "/home/user/mcfp/data/pose_samples"
  output_name: "pose_samples.npz"

delta:
  enable: true
  output_name: "pose_samples_with_deltas.npz"

robot:
  name: "franka"
  urdf_filename: "panda_arm.urdf"

sim:
  base_link: "panda_link0"
  end_effector_link: "panda_link7"

aabb:
  bounds_samples: 50000
  margin: 1.1

sampling:
  total_samples: 100000
  outside_ratio: 0.10
  outside_scale: 1.2
  fk_positive_ratio: 0.3
  progress_interval: 10000

ik:
  attempts: 5000
  pos_tol_m: 0.002
  ori_tol_deg: 4.0
  max_iters: 100
  residual_threshold: 1e-5

limits:
  eps: 1e-6

self_collision:
  auto_calibrate: true
  calibration_samples: 1000
  radius_min: 0.005
  radius_max: 0.03
  radius_default: 0.03
  radius_scale: 1.0

nearest:
  k: 50
  w_pos: 1.0
  w_rot: 1.0
  metric: "l2"
  max_distance: 0.5
  truncate_mode: "clip"
