# Logging config
logging:  # Logging config
  log_dir: "logs"  # Directory for log files

# Runtime settings
run:  # Runtime settings
  seed: 42  # RNG seed
  device: "cuda"  # Training device
  run_dir: "runs/stage1/exp_pose6d_v1"  # Output run directory
  max_steps: 5000000  # Total training steps
  log_interval: 1000  # Log frequency in steps
  val_interval: 5000  # Validation frequency in steps
  val_max_batches: 200  # Max validation batches
  val_ws_ratio: 0.5  # Validation ws/non-ws ratio
  val_batch_size: 10  # Validation batch size
  num_workers: 0  # DataLoader workers
  pin_memory: false  # Pin memory for host to device
  save_interval: 1000  # Checkpoint interval
  keep_last_n: 3  # Keep last N checkpoints

# Data and output paths
paths:  # Data and output paths
  repo_root: "D:/code//mcfp"  # Repository root
  manifest: "D:/code//mcfp/data/manifests/stage1_manifest.jsonl"  # Manifest path
  splits_dir: "D:/code/mcfp/data/splits"  # Split files directory
  stats: "D:/code/mcfp/data/stats/stage1_train_stats.json"  # Stats file path

# Data settings
data:  # Data settings
  batch_size: 30  # Training batch size

  ws_ratio: 0.5  # Training ws/non-ws ratio

  label_keys: []  # Optional label key override

  split:  # Train/val split settings
    mode: "within_morph"  # Split mode: within_morph or by_variant
    val_ratio: 0.1  # Validation ratio within each morph
    stratify_by_gws: true  # Stratify by g_ws labels
    seed: 42  # Split RNG seed

  pose_features:  # Pose feature construction
    primary_pos: "aabb_centered"  # Primary xyz feature
    include_aabb_ratio: true  # Append aabb ratio
    include_aabb_centered: true  # Append centered ratio
    include_morph_scale: true  # Append morph-scale xyz
    include_raw_pos: false  # Append raw xyz
    include_quat: true  # Append quaternion
    quat_normalize: false  # Normalize quaternion input
    eps: 1e-8  # Numerical epsilon

  delta_norm:  # Delta normalization
    pos: "aabb"  # Delta position normalization
    rot: "pi"  # Delta rotation normalization
    eps: 1e-8  # Numerical epsilon

# Model settings
model:  # Model settings
  d_model: 256  # Token dimension

  morph_graph:  # Morph graph options
    bidirectional: true  # Use bidirectional edges
    use_link_index_feature: true  # Add link index feature
  morph_encoder:  # Morph encoder options

    num_layers: 5  # GNN layers
    dropout: 0.1  # GNN dropout
    use_layernorm: true  # Use LayerNorm

  pose_encoder:  # Pose encoder options
    pose_dim: 13  # Input pose dim (auto override)
    emb_dim: 256  # Pose embedding dim
    num_bands: 10  # Fourier bands
    mlp_hidden: 256  # MLP hidden size
    mlp_layers: 3  # MLP layers
    dropout: 0.0  # MLP dropout
    include_xyz_raw: true  # Include raw xyz in Fourier

  backbone:  # Backbone options
    d_model: 256  # Backbone token dim
    nhead: 8  # Attention heads
    num_layers: 6  # Transformer layers
    dim_feedforward: 1024  # FFN size
    dropout: 0.1  # Backbone dropout
    max_nodes: null  # Optional node cap

  heads:  # Head options
    heads: []  # Explicit head configs
    default_hidden_dim: 256  # Default head hidden
    default_num_layers: 2  # Default head layers
    default_dropout: 0.0  # Default head dropout
    default_out_activation: identity  # Default head activation
    reg_out_activation: identity  # Regression head activation
    ws_out_activation: identity  # g_ws head activation

# Loss settings
loss:  # Loss settings
  ws_name: "g_ws"  # Workspace label name
  ws_with_logits: true  # g_ws uses logits
  reg_mask_key: "delta_mask"  # Regression mask key
  reg_mask_by_key: true  # Use mask key if present
  mask_by_ws: true  # Fallback mask by g_ws
  huber_delta: 0.05  # SmoothL1 delta
  ws_pos_weight: null  # Optional positive weight
  reg_clamp: false  # Clamp regression labels
  head_weights: {}  # Per-head loss weights

# Optimizer settings
optim:  # Optimizer settings
  lr: 0.0001  # Learning rate
  weight_decay: 0.01  # Weight decay
  grad_clip_norm: 1.0  # Grad clip norm
  use_amp: true  # Mixed precision
