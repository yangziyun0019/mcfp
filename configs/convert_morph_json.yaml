# configs/convert_morph_json.yaml

logging:
  log_dir: "logs/morph_specs"

run:
  seed: 42
  deterministic: true

aabb:
  bounds_samples: 50000
  margin: 1.1

robots:
  - urdf_path: "data/urdf/rm_65_b_description/urdf/rm_65_b_description.urdf"
    output_dir: "data/morph_specs/rm65"
    family: "rm65"
    robot_name: "rm65"
    base_link: "base_link"
    ee_link: "Link6"

  - urdf_path: "data/urdf/interbotix_descriptions/urdf/wx200.urdf"
    output_dir: "data/morph_specs/wx200"
    family: "wx200"
    robot_name: "wx200"
    base_link: "/base_link"
    ee_link: "/ee_arm_link"

  - urdf_path: "data/urdf/open_manipulator_description/urdf/open_manipulator.urdf"
    output_dir: "data/morph_specs/open_manipulator"
    family: "open_manipulator"
    robot_name: "open_manipulator"
    base_link: "link1"
    ee_link: "end_effector_link"

  - urdf_path: "data/urdf/franka_emika_panda/urdf/panda_arm.urdf"
    output_dir: "data/morph_specs/franka"
    family: "franka"
    robot_name: "franka"
    base_link: "panda_link0"
    ee_link: "panda_link7"

  - urdf_path: "data/urdf/aubo_description/urdf/aubo_i5.urdf"
    output_dir: "data/morph_specs/aubo_i5"
    family: "aubo_i5"
    robot_name: "aubo_i5"
    base_link: "base_link"
    ee_link: "wrist3_Link"

  - urdf_path: "data/urdf/ur_description/urdf/ur5.urdf"
    output_dir: "data/morph_specs/ur5"
    family: "ur5"
    robot_name: "ur5"
    base_link: "base_link"
    ee_link: "wrist_3_link"
