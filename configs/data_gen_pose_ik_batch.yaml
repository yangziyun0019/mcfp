# configs/data_gen_pose_ik_batch.yaml

logging:
  log_dir: "logs/pose_ik_batch"

run:
  seed: 42
  deterministic: true

data:
  output_root: "/home/user/mcfp/data/pose_samples"
  output_name: "pose_samples.npz"

delta:
  enable: true
  output_name: "pose_samples_with_deltas.npz"

aabb:
  bounds_samples: 50000
  margin: 1.1

sampling:
  total_samples: 100000
  outside_ratio: 0.10
  outside_scale: 1.2
  fk_positive_ratio: 0.3
  progress_interval: 10000

ik:
  attempts: 5
  pos_tol_m: 0.002
  ori_tol_deg: 4.0
  max_iters: 100
  residual_threshold: 1e-5

limits:
  eps: 1e-6

self_collision:
  auto_calibrate: true
  calibration_samples: 1000
  radius_min: 0.005
  radius_max: 0.03
  radius_default: 0.03
  radius_scale: 1.0

nearest:
  k: 50
  w_pos: 1.0
  w_rot: 1.0
  metric: "l2"
  max_distance: 0.5
  truncate_mode: "clip"

robots:
  - urdf_path: "/home/user/mcfp/data/urdf/rm_65_b_description/urdf/rm_65_b_description.urdf"
    robot_name: "rm65"
    base_link: "base_link"
    ee_link: "Link6"

  - urdf_path: "/home/user/mcfp/data/urdf/interbotix_descriptions/urdf/wx200.urdf"
    robot_name: "wx200"
    base_link: "/base_link"
    ee_link: "/ee_arm_link"

  - urdf_path: "/home/user/mcfp/data/urdf/open_manipulator_description/urdf/open_manipulator.urdf"
    robot_name: "open_manipulator"
    base_link: "link1"
    ee_link: "end_effector_link"

  - urdf_path: "/home/user/mcfp/data/urdf/franka_emika_panda/urdf/panda_arm.urdf"
    robot_name: "franka"
    base_link: "panda_link0"
    ee_link: "panda_link7"

  - urdf_path: "/home/user/mcfp/data/urdf/aubo_description/urdf/aubo_i5.urdf"
    robot_name: "aubo_i5"
    base_link: "base_link"
    ee_link: "wrist3_Link"

  - urdf_path: "/home/user/mcfp/data/urdf/ur_description/urdf/ur5.urdf"
    robot_name: "ur5"
    base_link: "base_link"
    ee_link: "wrist_3_link"
