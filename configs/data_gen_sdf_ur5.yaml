paths:
  repo_root: .
  urdf_path: data/urdf/ur_description/urdf/ur5.urdf
  output_root: data/sdf/ur5

logging:
  log_dir: logs

run:
  seed: 42
  deterministic: true

robot:
  base_link: base_link
  end_effector_link: wrist_3_link

aabb:
  bounds_samples: 50000
  margin: 1.1
  outside_scale: 1.5

lref:
  override: null

collision:
  mode: hybrid
  d_check: 0.015
  radius_min: 0.003
  radius_max: 0.03
  radius_default: 0.02
  radius_scale: 1.0
  auto_calibrate: false
  calibration_samples: 500

oracle:
  pos_tol_mm: 1.0
  rot_tol_deg: 1.0
  residual_threshold: 1.0e-5
  final_check_tier3: false
  tiers:
    - seeds: 4
      max_iters: 80
    - seeds: 16
      max_iters: 150
    - seeds: 64
      max_iters: 200

sampling:
  num_positive: 4000
  max_attempts_factor: 50
  progress_interval: 2000

  anchor_ratio: 0.05
  anchor_min: 0
  anchor_max: 5
  voxel_size: 0.01
  dir_bins: 32
  angle_bins: 6
  bias:
    use_sigma: true
    sigma_k: 0.1

  ray:
    K: 32
    lambda: 0.15
    t_max: 0.30
    eps: 0.001
    delta: 0.005
    bracket_steps: 20
    max_bisect_iters: 30
    axis_fraction: 0.25
    axis_mode: fixed_all
    include_boundary_points: true
    progress_interval: 1

  rot_far:
    N_p: 10
    N_R: 128
    progress_interval: 1

  pos_far:
    N: 10
    use_oracle: true
    progress_interval: 1
