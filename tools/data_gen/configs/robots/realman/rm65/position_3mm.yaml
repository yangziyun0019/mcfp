# RealMan RM65 position-dataset profile (3 mm voxel size).
robot:
  name: rm65
  urdf: src/robots/realman/rm_description/urdf/rm_65.urdf
  srdf: src/robots/realman/rm_moveit_config/config/rm_65_description.srdf
  group_name: rm_group
  base_link: base_link
  ee_link: Link6
  joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6

sampling:
  voxel_size: 0.003
  aabb_scale: 1.5
  aabb_samples: 20000
  fk_samples: 500000000
  fk_max_attempts: 500000000
  random_seed: 42
  fk_log_interval: 1000000
  threads: 12
  orientation_bins: 64
  coverage_check_interval: 1000000
  coverage_mode: heat
  coverage_delta_ratio: 0.01
  coverage_patience: 3
  coverage_min_occupied: 50000
  coverage_heat_min: 0.0005
  coverage_heat_alpha: 0.2

ik:
  attempts: 200
  timeout: 0.005
  attempts_refine: 400
  timeout_refine: 0.01
  search_discretization: 0.005

sdf:
  hole_fill_max_voxels: 2000
  closing_radius_voxels: 1

output:
  dir: tools/data_gen/outputs/realman/rm65/voxel_3mm
  write_fk_samples: true
  write_voxel_counts: true
  write_sdf_grid: true
  write_orientation_coverage: true
  write_npy: false
  write_metadata_yaml: false
  write_hdf5: true
  hdf5_path: tools/data_gen/outputs/realman/rm65/voxel_3mm/dataset.h5
  hdf5_chunk: 200000
