# Franka Emika Panda position-dataset profile (3 mm voxel size).
robot:
  name: panda
  urdf: src/robots/franka_emika_panda/urdf/panda_arm.urdf
  srdf: src/robots/franka_emika_panda_moveit_config/config/panda_arm.srdf
  group_name: panda_arm
  base_link: panda_link0
  ee_link: panda_link8
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

sampling:
  voxel_size: 0.003
  aabb_scale: 1.5
  aabb_samples: 20000
  fk_samples: 1000000000
  fk_max_attempts: 1000000000
  random_seed: 20260428
  joint_sequence: sobol_scrambled
  fk_log_interval: 5000000
  threads: 32
  orientation_bins: 64
  voxel_reservoir_max: 2
  coverage_check_interval: 5000000
  coverage_mode: heat
  coverage_delta_ratio: 0.01
  coverage_patience: 3
  coverage_min_occupied: 50000
  coverage_heat_min: 0.0005
  coverage_heat_alpha: 0.2
  frontier_seed_trials: 8
  frontier_targets_per_voxel: 4
  frontier_jitter_seed: 2026042801
  frontier_dls_steps: 8
  frontier_dls_lambda: 0.02
  frontier_max_passes: 4

ik:
  attempts: 200
  timeout: 0.005
  attempts_refine: 400
  timeout_refine: 0.01
  search_discretization: 0.005

sdf:
  hole_fill_max_voxels: 2000
  closing_radius_voxels: 1

output:
  dir: tools/data_gen/outputs/franka_emika_panda/panda/voxel_3mm
  write_fk_samples: true
  write_voxel_counts: true
  write_sdf_grid: true
  write_orientation_coverage: true
  write_npy: false
  write_metadata_yaml: false
  write_hdf5: true
  hdf5_path: tools/data_gen/outputs/franka_emika_panda/panda/voxel_3mm/dataset.h5
  hdf5_chunk: 200000
